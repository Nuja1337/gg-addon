# The addons' checks (`npm test`, that every addon is Lua 5.1 with TOCs that list files that exist) on every push to a
# branch and every pull request. Tags are left to release.yml, which runs the same checks before it packages anything.
name: Test

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        # The oldest Node that package.json allows, and the one the release runs on.
        node: [22, 24]
    # Pinned to the same commits as release.yml, for the same reason.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (v4.4.0)

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (v4.4.0)
        with:
          node-version: ${{ matrix.node }}

      - run: npm ci
      - run: npm test
